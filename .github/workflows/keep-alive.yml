name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Service
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        env:
          TARGET_URL: ${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://zerotrustnet.onrender.com' }}
        run: |
          echo "Pinging service at $TARGET_URL to prevent idle spin-down..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$TARGET_URL" || echo "000")
          echo "Ping completed with status code: $HTTP_STATUS"
